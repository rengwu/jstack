<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Questionnaire</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#18181b;color:#ededf0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:640px;margin:32px auto;padding:0 24px 48px}h1{font-size:22px;line-height:1.3;margin:0 0 8px;font-weight:600}fieldset{border:0;padding:0;margin:36px 0 44px;min-width:0}legend{font-size:18px;line-height:1.3;margin-bottom:10px;padding:0;font-weight:600}p{color:#b2b2bc;margin:0 0 12px;white-space:pre-wrap}.recommendation{font-size:12px;color:#a2a0ac;margin-bottom:16px}.choices{display:grid;gap:7px;margin-bottom:16px}.choice{display:flex;gap:10px;align-items:center;border:1px solid #39393f;border-radius:7px;padding:9px 11px;cursor:pointer;font-size:13px;line-height:1.45}.choice:hover{background:#242428}.choice:has(input:checked){border-color:#9b8ce9;background:#29243b;color:#d1c7ff}input[type=radio]{margin:0;width:14px;height:14px;flex-shrink:0;accent-color:#ad9afa}.choice:focus-within{outline:2px solid #ad9afa;outline-offset:2px}.notes-label{display:block;font-size:12px;margin-bottom:7px}textarea{width:100%;resize:vertical;min-height:78px;border:1px solid #414147;border-radius:7px;padding:10px;font:inherit;font-size:13px;color:#ededf0;background:#202023}textarea:focus{outline:2px solid #ad9afa;outline-offset:1px;border-color:#ad9afa}button{font:inherit;font-size:13px;cursor:pointer;border-radius:7px;padding:10px 18px;border:0;background:#b7a6ff;color:#1e1738}button:focus-visible{outline:2px solid #ad9afa;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.error{color:#ff9aac;font-size:13px}.confirmation{font-size:13px;margin-top:16px}@media(max-width:560px){main{margin:24px auto;padding:0 16px 32px}}
</style>
</head>
<body>
<main><h1 id="title"></h1><form id="questions"><button type="submit" id="submit" disabled>Submit answers</button><p id="message" role="status" tabindex="-1" hidden></p></form></main>
<noscript>Enable JavaScript to answer this offline form.</noscript>
<script type="application/json" id="grill-data">__GRILL_FORM_DATA__</script>
<script>
'use strict';
const state=JSON.parse(document.getElementById('grill-data').textContent);
const questions=state.spec.questions;
const storageKey='grill-form-'+state.sessionId;
const form=document.getElementById('questions');
const submit=document.getElementById('submit');
const message=document.getElementById('message');
const title=document.getElementById('title');
title.textContent=state.spec.title;document.title=state.spec.title;
let answers=questions.map(q=>({questionId:q.id,choiceId:null,notes:''}));
try{
 const draft=JSON.parse(sessionStorage.getItem(storageKey));
 if(Array.isArray(draft)&&draft.length===questions.length&&draft.every((a,i)=>a&&a.questionId===questions[i].id&&typeof a.notes==='string'&&a.notes.length<=12000&&(a.choiceId===null||a.choiceId==='other'||questions[i].options.some(o=>o.id===a.choiceId))))answers=draft;
}catch{} // Some browsers restrict storage on file://; in-memory editing still works.
function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
function complete(a){return a.choiceId==='other'?!!a.notes.trim():!!a.choiceId||!!a.notes.trim()}
function update(){
 submit.disabled=!answers.every(complete);submit.textContent='Submit answers';message.hidden=true;
 try{sessionStorage.setItem(storageKey,JSON.stringify(answers))}catch{}
}
questions.forEach((q,i)=>{
 const fieldset=element('fieldset');
 fieldset.append(element('legend',q.number+'. '+q.prompt));
 if(q.context)fieldset.append(element('p',q.context));
 fieldset.append(element('p','Recommended: '+q.recommendation,'recommendation'));
 const choices=element('div',undefined,'choices');
 [...q.options,{id:'other',label:'Something else'}].forEach(option=>{
  const label=element('label',undefined,'choice');
  const radio=element('input');radio.type='radio';radio.name=q.id;radio.value=option.id;radio.checked=answers[i].choiceId===option.id;
  radio.addEventListener('change',()=>{answers[i].choiceId=option.id;update()});
  label.append(radio,element('span',option.label));choices.append(label);
 });
 const notesLabel=element('label','Notes','notes-label');notesLabel.htmlFor='notes-'+q.id;
 const notes=element('textarea');notes.id='notes-'+q.id;notes.rows=3;notes.maxLength=12000;notes.value=answers[i].notes;notes.setAttribute('aria-label','Notes for question '+q.number);
 notes.addEventListener('input',()=>{answers[i].notes=notes.value;update()});
 fieldset.append(choices,notesLabel,notes);form.insertBefore(fieldset,submit);
});
submit.disabled=!answers.every(complete);
form.addEventListener('submit',event=>{
 event.preventDefault();
 if(!answers.every(complete))return;
 try{
  const payload={schemaVersion:1,sessionId:state.sessionId,specDigest:state.specDigest,answers};
  const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'});
  const url=URL.createObjectURL(blob),link=element('a');
  link.href=url;link.download='grill-form-'+state.sessionId+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  submit.textContent='Download answers again';message.className='confirmation';message.textContent='Save the answer file to Downloads, then return to the conversation. This page cannot confirm receipt.';message.hidden=false;message.focus();
  try{sessionStorage.removeItem(storageKey)}catch{}
 }catch{message.className='error';message.textContent='Could not export your answers. Please try again.';message.hidden=false;message.focus()}
});
</script>
</body>
</html>
