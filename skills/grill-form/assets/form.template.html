<!doctype html>
<html lang="en">
<head>

<title>Questionnaire</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#18181b;color:#ededf0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:32px auto;padding:0 24px 48px}h1{font-size:22px;line-height:1.3;margin:0 0 8px;font-weight:600}fieldset{border:0;padding:0;margin:36px 0 44px;min-width:0}legend{font-size:18px;line-height:1.3;margin-bottom:10px;padding:0;font-weight:600}p{color:#b2b2bc;margin:0 0 12px;white-space:pre-wrap}.recommendation{font-size:12px;color:#a2a0ac;margin-bottom:16px}.choices{display:grid;gap:7px;margin-bottom:16px}.choice{display:flex;gap:10px;align-items:center;border:1px solid #39393f;border-radius:7px;padding:9px 11px;cursor:pointer;font-size:13px;line-height:1.45}.choice:hover{background:#242428}.choice:has(input:checked){border-color:#9b8ce9;background:#29243b;color:#d1c7ff}input[type=radio]{margin:0;width:14px;height:14px;flex-shrink:0;accent-color:#ad9afa}.choice:focus-within{outline:2px solid #ad9afa;outline-offset:2px}.notes-label{display:block;font-size:12px;margin-bottom:7px}button{font:inherit;font-size:13px;cursor:pointer;border-radius:7px;padding:10px 18px;border:0;background:#b7a6ff;color:#1e1738}button:focus-visible{outline:2px solid #ad9afa;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.error{color:#ff9aac;font-size:13px}.confirmation{font-size:13px;margin-top:16px}@media(max-width:560px){main{margin:24px auto;padding:0 16px 32px}}
</style>
<style>
.description{margin:0 0 16px;min-width:0}.description.has-expansion{border:1px solid #39393f;border-radius:7px;padding:12px}.description[hidden],.description-toolbar[hidden]{display:none}.description-toolbar{display:flex;justify-content:flex-end;margin-top:8px}.expand{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:transparent;color:#c8bcff;padding:6px}.expand:hover{background:#323039}.expand svg{display:block;width:18px;height:18px}.rich-content{overflow-x:auto;overflow-wrap:anywhere;color:#c6c6d0}.rich-content p{white-space:normal;color:inherit;margin:0 0 12px}.rich-content>:last-child{margin-bottom:0}.rich-content h1,.rich-content h2,.rich-content h3,.rich-content h4,.rich-content h5,.rich-content h6{font-size:16px;margin:16px 0 8px;line-height:1.35}.rich-content ul,.rich-content ol{padding-left:24px}.rich-content li{margin:4px 0}.rich-content a{color:#c8bcff}.rich-content blockquote{margin:12px 0;padding:0 12px;border-left:3px solid #777084}.rich-content pre{overflow-x:auto;padding:12px;background:#121215;border-radius:5px;white-space:pre;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.rich-content code{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:#121215;padding:2px 4px;border-radius:3px}.rich-content pre code{padding:0;background:none}.rich-content table{border-collapse:collapse;width:max-content;min-width:100%;margin:12px 0;font-size:13px}.rich-content th,.rich-content td{padding:8px 12px;border:1px solid #45454e;text-align:left;max-width:400px}.rich-content th{background:#29292f}.rich-content th[align=center],.rich-content td[align=center]{text-align:center}.rich-content th[align=right],.rich-content td[align=right]{text-align:right}.rich-content hr{border:0;border-top:1px solid #45454e;margin:16px 0}.diagram{margin:12px 0;overflow-x:auto}.diagram svg{display:block;max-width:100%;height:auto;margin:auto}.diagram-error{color:#ff9aac;margin:0 0 6px;font-size:13px}.diagram details summary{cursor:pointer;font-size:12px;color:#c8bcff}.description.is-expanded{width:min(1100px,calc(100vw - 32px));position:relative;left:50%;transform:translateX(-50%);background:#202023}.description.is-expanded .diagram svg{max-width:none}.rich-content:focus-visible{outline:2px solid #ad9afa;outline-offset:3px}@media print{.description-toolbar{display:none}.description.is-expanded{width:auto;left:auto;transform:none}}
</style>
<style>
header{overflow-wrap:anywhere}header h2{font-size:16px;line-height:1.4;margin:0;color:#b2b2bc;font-weight:400}
.notes-editor{width:100%;min-height:96px;border:1px solid #414147;border-radius:7px;padding:10px;font-size:13px;color:#ededf0;background:#202023;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9}.notes-editor.compact{min-height:calc(1.9em + 22px)}.notes-editor:focus{outline:2px solid #ad9afa;outline-offset:1px;border-color:#ad9afa}.image-chip{display:inline-block;vertical-align:baseline;white-space:nowrap;background:#233943;border:1px solid #396371;border-radius:5px;padding:0 6px;margin:0 2px;color:#8bddf2;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;user-select:all}.image-chip:hover{background:#2d4956}.image-chip:focus-visible{outline:2px solid #ad9afa;outline-offset:1px}.image-preview{max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);padding:20px;background:#202023;color:#ededf0;border:1px solid #414147;border-radius:10px}.image-preview::backdrop{background:#000b}.image-preview h2{margin:0 0 12px;font-size:16px}.image-preview img{display:block;max-width:100%;max-height:70vh;object-fit:contain;margin:0 auto 16px}#draft-message{font-size:12px;margin-top:12px;color:#e7c58b}
</style>
<style>
.preview-shell{margin:12px 0;border:1px solid #414147;border-radius:8px;overflow:hidden}.preview-stage{position:relative;overflow:hidden}.prototype{display:block;width:100%;border:0;background:white}.preview-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 12px;background:#202023;border-bottom:1px solid #39393f}.comment-toggle{padding:6px 10px;font-size:12px;background:#302b40;color:#d8cdff;border:1px solid #65567e}.comment-toggle[aria-pressed=true]{background:#b7a6ff;color:#1e1738}.comment-hint{font-size:12px;color:#b2b2bc}.comment-surface{position:absolute;inset:0;overflow:hidden;cursor:crosshair;touch-action:none;user-select:none;background:#18181b20}.comment-surface[hidden],.comment-region[hidden]{display:none}.comment-surface:focus-visible{outline:2px solid #c3b0ff;outline-offset:-2px}.comment-region{position:absolute;border:2px solid #c3b0ff;background:#b7a6ff12;box-shadow:0 0 0 16000px #0006;pointer-events:none}.comment-location{margin:0 0 16px;background:#161619;pointer-events:none}.comment-location .preview-stage{transform-origin:top left}.comment-location .comment-surface{background:none;cursor:default}
.visual-choices>.quiet,.visual-choices>.choice{grid-column:1/-1;justify-self:stretch;text-align:left}.visual-choices{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}.choice-card{border:2px solid #39393f;border-radius:8px;overflow:hidden;min-width:0;cursor:pointer;transition:border-color .12s}.choice-card:hover{border-color:#797180}.choice-card .choice,.choice-card .choice:has(input:checked){border:0;border-radius:0;background:transparent;color:inherit;outline:none}.choice-card .preview-shell{margin:0;border:0;border-radius:0}.choice-card:has(input:checked){border-color:#b7a6ff;color:#ddd3ff}.choice-card:has(input:focus-visible){outline:2px solid #cfc0ff;outline-offset:3px}.quiet{background:transparent;color:#c8bcff;padding:5px 8px;font-size:12px}
.comment-summary{padding:12px 14px;margin:12px 0;border:1px solid #3e3a4a;border-radius:8px;background:#202023}.comment-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px;color:#c8bcff}.comment-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.comment-dialog{width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:22px;background:#202023;color:#ededf0;border:1px solid #575060;border-radius:12px;box-shadow:0 20px 80px #0008}.comment-dialog::backdrop{background:#0007}.comment-dialog h2{font-size:17px;line-height:1.4;margin:0 0 16px}.comment-dialog .notes-editor{min-height:140px}.comment-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.comment-actions>button:first-child:not(:nth-last-child(2)){margin-right:auto}.review-hint{font-size:12px;margin-top:12px;color:#a2a0ac}.diagram{--pele-bg:#202023;--pele-fg:#ededf0;--pele-border:#777084;--pele-line:#b7a6ff;--pele-surface:#29292f;--pele-surface-alt:#36323e;--pele-muted:#b2b2bc;--pele-accent:#ad9afa}
</style>
</head>
<body>
<main><header><h1 id="project-name"></h1><h2 id="title"></h2></header><form id="questions"><div id="actions"><button type="submit" id="submit" disabled>Submit feedback</button></div><p id="draft-message" role="status" hidden></p><p id="message" role="status" tabindex="-1" hidden></p></form></main>
<noscript>Enable JavaScript to answer this offline form.</noscript>
<script type="application/json" id="grill-data">__GRILL_FORM_DATA__</script>
__GRILL_FORM_RENDERERS__
<script>
'use strict';
const state=JSON.parse(document.getElementById('grill-data').textContent);
const questions=state.spec.questions;
const storageKey='grill-form-'+state.sessionId;
const form=document.getElementById('questions');
const actions=document.getElementById('actions');
const submit=document.getElementById('submit');
const message=document.getElementById('message');
const title=document.getElementById('title');
document.getElementById('project-name').textContent=state.projectName;
title.textContent=state.spec.title;document.title=state.projectName+' — '+state.spec.title;
let answers=questions.map(q=>({questionId:q.id,choiceId:null,notes:''}));
try{
 const draft=state.archived ? state.savedAnswers : JSON.parse(sessionStorage.getItem(storageKey));
 if(Array.isArray(draft)&&draft.length===questions.length&&draft.every((a,i)=>a&&a.questionId===questions[i].id&&typeof a.notes==='string'&&a.notes.length<=12000&&validReviewDraft(a,questions[i])&&(a.choiceId===null||a.choiceId==='other'||questions[i].options.some(o=>o.id===a.choiceId))))answers=draft;
}catch{} // Some browsers restrict storage on file://; in-memory editing still works.
try{restoreImages()}catch{answers=questions.map(q=>({questionId:q.id,choiceId:null,notes:''}));imageAssets.clear()}
function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
const escapeHTML=text=>text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let diagramNumber=0;
let diagramQueue=Promise.resolve();
function diagramFallback(container,source,reason){
 container.replaceChildren(element('p','Diagram could not be rendered. '+reason,'diagram-error'));
 const details=element('details');details.open=true;
 const pre=element('pre');pre.append(element('code',source));
 details.append(element('summary','Diagram source'),pre);container.append(details);container.dataset.renderState='error';
}
async function renderDiagram(container,source){
 if(/%%\s*\{/.test(source)||/^\s*---/.test(source)){
  diagramFallback(container,source,'Use Mermaid syntax without configuration directives.');return;
 }
 try{
  const {svg}=pele.render(source,{idPrefix:'grill-diagram-'+(++diagramNumber),links:false,images:false,autoDirection:false,limit:12000,maxEdges:150,outputLimit:1000000});
  container.innerHTML=DOMPurify.sanitize(svg,{USE_PROFILES:{svg:true,svgFilters:true},FORBID_TAGS:['foreignObject','image','a','style']});
  const drawing=container.querySelector('svg');
  const width=drawing?.viewBox.baseVal.width;
  if(width){drawing.style.width=Math.ceil(width)+'px';drawing.style.maxWidth='';}
  container.dataset.renderState='ready';
 }catch{diagramFallback(container,source,'You can still answer this question.');}
}
function description(source,number){
 const wrapper=element('section',undefined,'description');wrapper.setAttribute('aria-label','Description for question '+number);
 const content=element('div',undefined,'rich-content');content.id='description-'+number;wrapper.append(content);
 try{
  const renderer=new marked.Renderer();
  renderer.html=({text})=>escapeHTML(text);
  renderer.image=({text})=>escapeHTML(text);
  const html=marked.parse(source,{gfm:true,breaks:false,renderer});
  content.innerHTML=DOMPurify.sanitize(html,{ALLOWED_TAGS:['p','br','strong','em','del','a','ul','ol','li','blockquote','h1','h2','h3','h4','h5','h6','pre','code','table','thead','tbody','tr','th','td','hr'],ALLOWED_ATTR:['href','title','class','align','start']});
  content.querySelectorAll('a').forEach(link=>{if(!/^https?:\/\//i.test(link.getAttribute('href')||'')){link.removeAttribute('href');return;}link.target='_blank';link.rel='noopener noreferrer';});
  content.querySelectorAll('pre > code.language-mermaid').forEach(code=>{
   const diagram=element('div','Rendering diagram…','diagram');diagram.dataset.renderState='pending';diagram.tabIndex=0;diagram.setAttribute('role','region');diagram.setAttribute('aria-label','Diagram for question '+number);
   const definition=code.textContent;code.parentElement.replaceWith(diagram);
   diagramQueue=diagramQueue.then(()=>renderDiagram(diagram,definition)).catch(()=>diagramFallback(diagram,definition,'You can still answer this question.'));
  });
 }catch{content.append(element('p','Description could not be rendered; original source follows.','error'),element('pre',source));}
 const hasDiagram=!!content.querySelector('.diagram'),wideContent=[...content.querySelectorAll('table,pre')];
 if(!hasDiagram&&!wideContent.length)return wrapper;
 const toolbar=element('div',undefined,'description-toolbar');
 const expand=element('button',undefined,'expand');expand.type='button';expand.setAttribute('aria-controls',content.id);
 const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('fill','none');icon.setAttribute('stroke','currentColor');icon.setAttribute('stroke-width','1.75');icon.setAttribute('stroke-linecap','round');icon.setAttribute('stroke-linejoin','round');icon.setAttribute('aria-hidden','true');
 const iconPath=document.createElementNS('http://www.w3.org/2000/svg','path');icon.append(iconPath);expand.append(icon);
 function refresh(){
  const expanded=wrapper.classList.contains('is-expanded');
  const available=expanded||hasDiagram||wideContent.some(node=>node.scrollWidth>content.clientWidth+1);
  toolbar.hidden=!available;wrapper.classList.toggle('has-expansion',available);
  content.tabIndex=available?0:-1;
  const label=expanded?'Collapse description':'Expand description';expand.setAttribute('aria-expanded',String(expanded));expand.setAttribute('aria-label',label);expand.title=label;
  iconPath.setAttribute('d',expanded?'M3 9h6V3M9 9 3 3M21 15h-6v6M15 15l6 6':'M9 3H3v6M3 3l6 6M15 21h6v-6M21 21l-6-6');
 }
 expand.addEventListener('click',()=>{wrapper.classList.toggle('is-expanded');refresh()});
 wrapper.addEventListener('keydown',event=>{if(event.key==='Escape'&&wrapper.classList.contains('is-expanded')){expand.click();expand.focus();}});
 toolbar.append(expand);wrapper.append(toolbar);
 new ResizeObserver(refresh).observe(content);refresh();
 return wrapper;
}
function complete(a){return a.choiceId==='other'?!!a.notes.trim():!!a.choiceId||!!a.notes.trim()}
function update(){
 submit.disabled=!canSubmit()||!notesReady();submit.textContent='Submit feedback';message.hidden=true;
 if(state.archived)return;
 const warning=document.getElementById('draft-message');
 if(!notesReady())return;
 try{sessionStorage.setItem(storageKey,JSON.stringify(answers));warning.hidden=true}catch{
  try{sessionStorage.removeItem(storageKey)}catch{}
  warning.textContent='This draft could not be saved in the browser. Keep this tab open until you download your answers.';warning.hidden=false;
 }
}
questions.forEach((q,i)=>{
 const fieldset=element('fieldset');
 fieldset.append(element('legend',(q.prompt ? q.number+'. '+q.prompt : 'Review '+q.number)+(q.required?' · Required':'')));
 const comments=commentControls(q,i);
 if(q.preview)fieldset.append(renderPreview(q.preview,i,'main',comments.add));
 if(q.context.trim())fieldset.append(state.richText?description(q.context,q.number):element('p',q.context));
 if(q.recommendation)fieldset.append(element('p','Recommended: '+q.recommendation,'recommendation'));
 const choices=element('div',undefined,'choices'+(q.options.some(o=>o.preview)?' visual-choices':''));
 const clear=q.options.length?element('button','Clear selection','quiet clear-selection'):null;
 (q.options.length?[...q.options,{id:'other',label:'Something else'}]:[]).forEach(option=>{
  const label=element('label',undefined,'choice');
  const radio=element('input');radio.type='radio';radio.name=q.id;radio.value=option.id;radio.checked=answers[i].choiceId===option.id;
  radio.addEventListener('change',()=>{answers[i].choiceId=option.id;clear.hidden=false;update()});
  label.append(radio,element('span',option.label));
  if(option.preview){const card=element('div',undefined,'choice-card');const select=()=>{if(!state.archived&&!radio.checked)radio.click()};card.addEventListener('click',select);card.append(renderPreview(option.preview,i,'option-'+option.id,comments.add,select),label);choices.append(card)}else choices.append(label);
 });
 if(clear){clear.type='button';clear.hidden=state.archived||!answers[i].choiceId;clear.addEventListener('click',()=>{const chosen=choices.querySelector('input:checked');answers[i].choiceId=null;choices.querySelectorAll('input').forEach(r=>r.checked=false);clear.hidden=true;update();chosen?.focus()});choices.append(clear)}
 const notesLabel=element('div','Notes','notes-label');
 const {notes,error}=createNotesEditor(q,i);
 if(q.options.length)notes.classList.add('compact');
 fieldset.append(choices,comments.box,notesLabel,notes,error);form.insertBefore(fieldset,actions);
});
if(state.review){const hint=element('p',state.archived?'Saved review. Feedback and prototype state are restored below.':'Share feedback on any item. Untouched items remain open.','review-hint');document.querySelector('header').append(hint)}
if(state.archived){actions.hidden=true;form.querySelectorAll('input,select,button:not(.expand):not(.view-comment)').forEach(node=>node.disabled=true);form.querySelectorAll('[contenteditable]').forEach(node=>node.contentEditable='false')}
submit.disabled=!canSubmit()||!notesReady();
form.addEventListener('submit',event=>{
 event.preventDefault();
 if(!canSubmit()||!notesReady())return;
 try{
  const payload={schemaVersion:1,sessionId:state.sessionId,specDigest:state.specDigest,answers};
  const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'});
  const url=URL.createObjectURL(blob),link=element('a');
  link.href=url;link.download='grill-form-'+state.sessionId+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  submit.textContent='Download answers again';message.className='confirmation';message.textContent='Save the answer file to Downloads, then return to the conversation. This page cannot confirm receipt.';message.hidden=false;message.focus();
  try{sessionStorage.removeItem(storageKey)}catch{}
 }catch{message.className='error';message.textContent='Could not export your answers. Please try again.';message.hidden=false;message.focus()}
});
</script>
</body>
